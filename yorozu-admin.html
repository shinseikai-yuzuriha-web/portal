<title>よろず相談室｜管理</title>
<style>
  :root {
    --ink: #333333; --sub: #66665c; --line: #e0e0d6; --bg: #f7f6f0; --card: #fff;
    --main: #628741; --main-dark: #4b6a30; --main-soft: #eef3e6;
    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "BIZ UDPMincho", "Noto Serif JP", serif;
    --new: #d9551f; --new-soft: #fdeee6; --doing: #a15c00; --doing-soft: #fff3dc; --done: #475467; --done-soft: #eef0f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ログイン */
  .login { max-width: 360px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; text-align: center; }
  .login h1 { font-family: var(--mincho); letter-spacing: .06em; font-size: 23px; margin: 0 0 4px; }
  .login p { color: var(--sub); margin: 0 0 18px; }
  .login input { width: 100%; text-align: center; font-size: 28px; letter-spacing: .4em; padding: 10px; border: 2px solid var(--line); border-radius: 10px; }
  .login .msg { color: var(--new); min-height: 1.6em; margin-top: 8px; font-weight: 700; }

  .btn { border: 0; border-radius: 999px; padding: 8px 18px; background: var(--main); color: #fff; font-weight: 700; }
  .btn:hover { background: var(--main-dark); }
  .btn.big { width: 100%; padding: 12px; font-size: 17px; margin-top: 10px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  .btn.ghost:hover { background: #f0f2f5; }
  .btn.danger { background: #fff; color: var(--new); border: 1px solid #f3c1bb; font-weight: 400; }
  .btn[disabled] { opacity: .6; cursor: wait; }

  /* 上の帯 */
  .top { position: sticky; top: 0; z-index: 5; background: #fff; color: var(--ink); border-bottom: 3px solid var(--main); display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .top h1 { font-family: var(--mincho); font-size: 18px; letter-spacing: .06em; margin: 0; flex: 1; }
  .top h1 small { font-family: sans-serif; font-size: 12px; color: var(--main); letter-spacing: .1em; margin-right: 8px; }
  .top .who { font-size: 14px; color: var(--sub); }
  .top .btn.ghost { padding: 4px 10px; }
  .tabs { display: flex; gap: 4px; padding: 10px 16px 0; }
  .tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--sub); font-weight: 700; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--main-dark); box-shadow: 0 -1px 0 var(--line) inset; }

  main { padding: 0 16px 40px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 0 18px 18px 18px; padding: 14px; }

  /* 絞り込み */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; }
  .seg button[aria-pressed="true"] { background: var(--main); color: #fff; font-weight: 700; }
  .seg .cnt { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--new); color: #fff; font-size: 12px; font-weight: 700; }
  .filters select, .filters input[type=search] { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; }
  .filters input[type=search] { min-width: 180px; flex: 1; }
  .filters label.chk { display: inline-flex; align-items: center; gap: 6px; }
  .count { color: var(--sub); font-size: 14px; margin: 0 0 8px; }

  /* 一覧 */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 980px) { .layout.open { grid-template-columns: minmax(0, 1fr) 440px; } }
  .list { display: grid; gap: 8px; align-content: start; }
  .layout { align-items: start; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .item:hover { border-color: #b9c2cf; }
  .item[aria-current="true"] { border-color: var(--main); box-shadow: 0 0 0 2px var(--main-soft); }
  .item .no { font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; }
  .item .kinds { font-weight: 700; }
  .item .meta { grid-column: 2 / 4; color: var(--sub); font-size: 13px; }
  .badge { display: inline-block; border-radius: 999px; padding: 0 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .b-未対応 { background: var(--new-soft); color: var(--new); }
  .b-対応中 { background: var(--doing-soft); color: var(--doing); }
  .b-完了 { background: var(--done-soft); color: var(--done); }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }

  /* 詳しく */
  .detail { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; align-self: start; position: sticky; top: 60px; max-height: calc(100vh - 76px); overflow: auto; }
  @media (max-width: 979px) { .detail { position: fixed; inset: 0; top: 0; max-height: none; border-radius: 0 !important; z-index: 30; } }
  .detail h2 { font-family: var(--mincho); font-size: 19px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .detail .close { margin-left: auto; }
  .detail h3 { font-size: 14px; color: var(--main-dark); margin: 18px 0 6px; border-top: 1px solid var(--line); padding-top: 12px; }
  .kv { display: grid; grid-template-columns: 8.5em 1fr; gap: 6px 10px; margin-top: 10px; }
  .kv dt { color: var(--sub); }
  .kv dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .kv a { color: var(--main-dark); font-weight: 700; }
  .ctl { display: grid; gap: 8px; }
  .ctl .seg { width: max-content; }
  .ctl select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; }
  .notes { display: grid; gap: 8px; }
  .note { background: var(--main-soft); border-radius: 8px; padding: 8px 10px; }
  .note .by { font-size: 12px; color: var(--sub); }
  .note .body { white-space: pre-wrap; word-break: break-word; }
  textarea.memo { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .hist { font-size: 13px; color: var(--sub); margin: 0; padding-left: 18px; }

  /* 職員 */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--sub); }
  .form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .form-row input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .off { color: var(--sub); text-decoration: line-through; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--main-dark); color: #fff; border-radius: 10px; padding: 10px 16px; z-index: 30; max-width: 90vw; }
  .toast.err { background: var(--new); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .modal .box { background: #fff; border-radius: 14px; padding: 22px; max-width: 420px; width: 100%; text-align: center; }
  .modal .pin { font-size: 36px; letter-spacing: .3em; font-weight: 700; margin: 10px 0; font-variant-numeric: tabular-nums; }

  /* ===== ゆずりは・おしゃれ版 ===== */
  :root { --sage: #e1eee5; --deep: #3f5a2a; --shadow: 0 8px 26px rgba(63, 90, 42, .08); }
  body { background: radial-gradient(circle at 0% 0%, #e7f0df 0, rgba(231,240,223,0) 40%), #faf9f6; }
  .login { border: 0; box-shadow: var(--shadow); border-radius: 28px; background: linear-gradient(160deg, #ffffff 60%, #eef4e7); }
  .login h1 { color: var(--deep); }
  .login input { border: 1.5px solid #e4e6dc; border-radius: 16px; }
  .login input:focus { outline: none; border-color: var(--main); box-shadow: 0 0 0 4px rgba(98,135,65,.15); }
  .top { background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border-bottom: 0; box-shadow: 0 2px 0 var(--main), 0 6px 18px rgba(63,90,42,.06); }
  .top h1 { color: var(--deep); }
  .btn { background: linear-gradient(135deg, #6f9a4a, #557a37); box-shadow: 0 4px 12px rgba(85,122,55,.22); }
  .btn:hover { background: linear-gradient(135deg, #64903f, #4b6a30); }
  .btn.ghost, .btn.danger { box-shadow: none; }
  .btn.ghost { background: #fff; }
  .tabs button[aria-selected="true"] { box-shadow: none; position: relative; }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--main); }
  .panel { border: 0; box-shadow: var(--shadow); border-radius: 0 24px 24px 24px; }
  .seg { border-color: #e4e6dc; }
  .seg button[aria-pressed="true"] { background: linear-gradient(135deg, #6f9a4a, #557a37); }
  .filters select, .filters input[type=search], .ctl select, textarea.memo, .form-row input[type=text] { border: 1.5px solid #e4e6dc; border-radius: 12px; background: #fdfdfb; }
  .item { border: 1.5px solid #eceee6; border-radius: 16px; background: #fdfdfb; transition: border-color .15s, box-shadow .15s, transform .1s; }
  .item:hover { border-color: #c9d6bd; box-shadow: 0 6px 16px rgba(63,90,42,.07); transform: translateY(-1px); }
  .item[aria-current="true"] { border-color: var(--main); box-shadow: 0 6px 18px rgba(98,135,65,.16); background: linear-gradient(135deg, #f6faf1, #eef4e7); }
  .item .no { color: var(--main); font-family: var(--mincho); font-style: italic; }
  .detail { border: 0; box-shadow: var(--shadow); border-radius: 24px; }
  .detail h3 { border-top: 1px dashed #d5dccb; }
  .note { background: linear-gradient(135deg, #f1f7ea, #e9f1e1); border-radius: 14px; }
  .modal .box { border-radius: 24px; }
  .modal .pin { color: var(--deep); }
  .login-logo { width: 104px; height: 104px; border-radius: 50%; display: block; margin: -4px auto 12px; box-shadow: 0 8px 22px rgba(63,90,42,.16), 0 0 0 5px #fff; }
  .seg { max-width: 100%; overflow-x: auto; }
  .seg button { white-space: nowrap; flex: none; }
  .top h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 600px) {
    .top { gap: 8px; padding: 8px 12px; }
    .top h1 { font-size: 16px; }
    .top h1 small { display: none; }
    .top .who { font-size: 12px; white-space: nowrap; }
    main { padding: 0 10px 32px; }
    .tabs { padding: 8px 10px 0; }
    .filters select, .filters input[type=search] { width: 100%; min-width: 0; flex: 1 1 100%; }
  }
  .top-logo { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 2px 6px rgba(63,90,42,.18); }

  /* ===== 文字色（さわやか版） ===== */
  :root { --ink: #2b3a4f; --sub: #6a7889; --deep: #3f8030; --teal: #2a8c86; }
  body { color: var(--ink); }

  .login h1, .top h1 {
    background: linear-gradient(100deg, #4f9a2e 0%, #2a8c86 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .top h1 small { -webkit-text-fill-color: var(--teal); color: var(--teal); }
  .item .no { color: var(--teal); }
  .detail h2 { color: var(--ink); }
  .detail h3 { color: var(--teal); }
  .tabs button[aria-selected="true"] { color: var(--deep); }
  .kv dt, .count, .item .meta, .hist, .note .by { color: var(--sub); }
  .kv a { color: var(--teal); }
  .modal .pin { color: var(--deep); }

  /* ===== テストモード ===== */
  .test-band { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; background: #c2410c; color: #fff; padding: 7px 14px; font-size: 14px; }
  .test-band strong { background: #fff; color: #c2410c; border-radius: 999px; padding: 0 10px; }
  .test-band a, .test-band button { color: #fff; background: transparent; border: 1.5px solid rgba(255,255,255,.7); border-radius: 999px; padding: 1px 12px; text-decoration: none; font-size: 13px; }
  .test-band a:hover, .test-band button:hover { background: rgba(255,255,255,.15); }
  body:has(#testBand:not([hidden])) .top { top: 38px; }
  #roleBtns .btn { margin-top: 10px; }
  .mm-panel { position: fixed; right: 16px; bottom: 16px; z-index: 25; width: 360px; max-width: calc(100vw - 32px); }
  .mm-toggle { display: block; margin-left: auto; border: 0; border-radius: 999px; background: #1c58d9; color: #fff; padding: 10px 18px; font-weight: 700; box-shadow: 0 6px 18px rgba(28,88,217,.3); }
  .mm-count { display: inline-block; margin-left: 8px; min-width: 22px; padding: 0 6px; border-radius: 999px; background: #fff; color: #1c58d9; font-size: 13px; }
  .mm-list { display: none; margin-top: 8px; max-height: 60vh; overflow: auto; background: #fff; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 12px; }
  .mm-panel.open .mm-list { display: grid; gap: 10px; }
  .mm-post { border-left: 4px solid #1c58d9; background: #f4f6fa; border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .mm-head { font-weight: 700; color: #1c58d9; font-size: 13px; }
  .mm-head span { color: var(--sub); font-weight: 400; margin-left: 6px; }
  .mm-body { white-space: pre-wrap; word-break: break-word; }
  .mm-body a { color: #1c58d9; }
  .mm-body .at { color: #1c58d9; background: #e3ebfb; border-radius: 4px; padding: 0 3px; }
</style>
</head>

<script>
// ===== 接続先（Supabase の Project URL と anon キー） =====
const SUPABASE_URL = 'https://lzkeaetpykhdrwwwspjy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6a2VhZXRweWtoZHJ3d3dzcGp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNDM3MTgsImV4cCI6MjEwOTgxOTcxOH0.w_iThhR7s9ZF2R_Co3OIedwdQcsFGSb7WqX4TTTE0uM';

const TEST = new URLSearchParams(location.search).has('test') || SUPABASE_URL.startsWith('__');
const $ = (id) => document.getElementById(id);
const STATUSES = ['未対応', '対応中', '完了'];
const S = { token: null, me: null, cases: [], staff: [], kinds: [], filter: { status: 'open', kind: '', q: '', mine: false }, openId: null };

const TOKEN_KEY = TEST ? 'yorozu_test_token' : 'yorozu_token';
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} },
};

async function api(fn, args) {
  if (TEST) {
    try { const r = await window.YorozuMock.call(fn, args); if (TEST) setTimeout(renderMm, 0); return r; }
    catch (e) { if (e.code === 'P0401') logoutLocal(e.message); throw e; }
  }
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
    body: JSON.stringify(args || {}),
  });
  const r = await res.json().catch(() => null);
  if (!res.ok) {
    const e = new Error((r && r.message) || '通信がうまくいきませんでした');
    e.code = r && r.code;
    if (e.code === 'P0401') { logoutLocal(e.message); }
    throw e;
  }
  return r;
}

function toast(msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 5000 : 2500);
}
const fail = (e) => toast(e.message, true);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(ts, withTime = true) {
  if (!ts) return '';
  const d = new Date(ts);
  const w = '日月火水木金土'[d.getDay()];
  const base = `${d.getMonth() + 1}/${d.getDate()}（${w}）`;
  return withTime ? `${base} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}` : base;
}

// ---------- ログイン ----------
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.submitter || $('loginForm').querySelector('button');
  btn.disabled = true; $('loginMsg').textContent = '';
  try {
    const r = await api('yorozu_login', { p_pin: $('pin').value.trim() });
    if (r.error) { $('loginMsg').textContent = r.error; $('pin').select(); return; }
    S.token = r.token; store.set(TOKEN_KEY, r.token);
    $('pin').value = '';
    await start();
  } catch (err) { $('loginMsg').textContent = err.message; }
  finally { btn.disabled = false; }
});

function logoutLocal(msg) {
  S.token = null; S.me = null; S.cases = []; S.openId = null;
  store.set(TOKEN_KEY, null);
  $('list').innerHTML = ''; $('detail').hidden = true; $('detail').innerHTML = '';
  $('appView').hidden = true; $('loginView').hidden = false;
  $('loginMsg').textContent = msg || '';
  $('pin').focus();
}
$('logout').addEventListener('click', async () => {
  const t = S.token;
  logoutLocal('');
  if (t) api('yorozu_logout', { p_token: t }).catch(() => {});
});

async function start() {
  await loadList();
  $('loginView').hidden = true; $('appView').hidden = false;
  $('who').textContent = S.me.name + ' さん' + (S.me.is_admin ? '（管理者）' : '');
  $('tabStaff').hidden = !S.me.is_admin;
  const m = location.hash.match(/^#Y(\d+)$/);
  if (m) openCase(Number(m[1]));
}

// ---------- 一覧 ----------
async function loadList() {
  const r = await api('yorozu_list', { p_token: S.token });
  S.me = r.me; S.cases = r.cases; S.staff = r.staff;
  if (!S.kinds.length) {
    S.kinds = r.kinds;
    r.kinds.forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k; $('kindSel').appendChild(o); });
  }
  renderList();
}

function filtered() {
  const f = S.filter, q = f.q.trim().toLowerCase();
  return S.cases.filter(c => {
    if (f.status === 'open' && c.status === '完了') return false;
    if (STATUSES.includes(f.status) && c.status !== f.status) return false;
    if (f.kind && !c.kinds.includes(f.kind)) return false;
    if (f.mine && c.assignee_id !== S.me.id) return false;
    if (q) {
      const hay = [c.no, c.name, c.phone, c.email, c.detail, c.assignee, c.kinds.join(' ')].join(' ').toLowerCase();
      const qd = q.replace(/[^0-9]/g, '');
      if (!hay.includes(q) && !(qd.length >= 3 && String(c.phone).replace(/[^0-9]/g, '').includes(qd))) return false;
    }
    return true;
  });
}

function renderStatusSeg() {
  const n = (s) => S.cases.filter(c => c.status === s).length;
  const opts = [['open', '未完了'], ['未対応', '未対応'], ['対応中', '対応中'], ['完了', '完了'], ['all', 'すべて']];
  $('statusSeg').innerHTML = opts.map(([v, label]) => {
    const cnt = v === '未対応' && n('未対応') ? `<span class="cnt">${n('未対応')}</span>` : '';
    return `<button type="button" data-v="${v}" aria-pressed="${S.filter.status === v}">${label}${cnt}</button>`;
  }).join('');
}
$('statusSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  S.filter.status = b.dataset.v; renderList();
});
$('kindSel').addEventListener('change', (e) => { S.filter.kind = e.target.value; renderList(); });
$('q').addEventListener('input', (e) => { S.filter.q = e.target.value; renderList(); });
$('mine').addEventListener('change', (e) => { S.filter.mine = e.target.checked; renderList(); });
$('reload').addEventListener('click', () => loadList().then(() => { if (S.openId) openCase(S.openId, true); toast('最新にしました'); }).catch(fail));

function renderList() {
  renderStatusSeg();
  const rows = filtered();
  $('count').textContent = `${rows.length}件` + (rows.length !== S.cases.length ? `（全${S.cases.length}件中）` : '');
  $('list').innerHTML = rows.length ? rows.map(c => `
    <button type="button" class="item" data-id="${c.id}" aria-current="${c.id === S.openId}">
      <span class="no">${esc(c.no)}</span>
      <span class="kinds">${esc(c.kinds.join('／'))}</span>
      <span class="badge b-${esc(c.status)}">${esc(c.status)}</span>
      <span class="meta">${esc(fmt(c.created_at))}　${esc(c.name)} 様　担当：${esc(c.assignee || '未定')}${c.note_count ? '　メモ ' + c.note_count : ''}</span>
    </button>`).join('') : '<div class="empty">該当する相談はありません</div>';
}
$('list').addEventListener('click', (e) => {
  const b = e.target.closest('.item'); if (b) openCase(Number(b.dataset.id));
});

// ---------- 詳しく ----------
async function openCase(id, quiet) {
  try {
    const c = await api('yorozu_get', { p_token: S.token, p_id: id });
    S.openId = id;
    history.replaceState(null, '', '#Y' + id);
    renderDetail(c);
    const i = S.cases.findIndex(x => x.id === id);
    if (i >= 0) { S.cases[i] = { ...S.cases[i], ...c }; }
    renderList();
  } catch (e) { if (!quiet) fail(e); }
}

function closeDetail() {
  S.openId = null; $('detail').hidden = true; $('layout').classList.remove('open');
  history.replaceState(null, '', location.pathname + location.search);
  renderList();
}

function renderDetail(c) {
  const d = $('detail');
  const tel = String(c.phone).replace(/[^0-9+]/g, '');
  d.innerHTML = `
    <h2>${esc(c.no)} <span class="badge b-${esc(c.status)}">${esc(c.status)}</span>
      <button class="btn ghost close" type="button" id="closeDetail">閉じる</button></h2>
    <dl class="kv">
      <dt>受付</dt><dd>${esc(fmt(c.created_at))}</dd>
      <dt>相談の内容</dt><dd>${esc(c.kinds.join('\n'))}</dd>
      <dt>くわしい内容</dt><dd>${esc(c.detail || '（なし）')}</dd>
      <dt>相談するのは</dt><dd>${esc(c.relation || '（選択なし）')}</dd>
      <dt>お名前</dt><dd>${esc(c.name)} 様</dd>
      <dt>電話番号</dt><dd><a href="tel:${esc(tel)}">${esc(c.phone)}</a></dd>
      <dt>メール</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '（なし）'}</dd>
      <dt>連絡の方法</dt><dd>${esc(c.contact_method || '（選択なし）')}</dd>
      <dt>都合のよい時間</dt><dd>${esc(c.contact_time || '（なし）')}</dd>
    </dl>

    <h3>状況と担当</h3>
    <div class="ctl">
      <div class="seg" id="stSeg">${STATUSES.map(s => `<button type="button" data-v="${s}" aria-pressed="${c.status === s}">${s}</button>`).join('')}</div>
      <label>担当：
        <select id="asgSel"><option value="">未定</option>${S.staff.map(s => `<option value="${s.id}" ${s.id === c.assignee_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      </label>
      <div><button class="btn" type="button" id="saveCtl">変更を保存</button></div>
    </div>

    <h3>対応メモ（${c.notes.length}）</h3>
    <div class="notes">${c.notes.map(n => `<div class="note"><div class="by">${esc(fmt(n.at))}　${esc(n.by || '')}</div><div class="body">${esc(n.body)}</div></div>`).join('') || '<div class="count">まだありません</div>'}</div>
    <textarea class="memo" id="memo" placeholder="例）11/26 電話。訪問診療の説明をした。来週もう一度連絡"></textarea>
    <div><button class="btn" type="button" id="addNote">メモを足す</button></div>

    <h3>履歴</h3>
    <ul class="hist">${c.history.map(h => `<li>${esc(fmt(h.at))}　${esc(h.by || '')}：${esc(h.action)} ${esc(h.detail || '')}</li>`).join('') || '<li>なし</li>'}</ul>
    ${S.me.is_admin ? '<h3>削除</h3><button class="btn danger" type="button" id="delCase">この相談を削除する</button>' : ''}
  `;
  d.hidden = false; $('layout').classList.add('open');
  let st = c.status;
  $('stSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    st = b.dataset.v;
    $('stSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('closeDetail').addEventListener('click', closeDetail);
  $('saveCtl').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try {
      const v = $('asgSel').value;
      const r = await api('yorozu_update', { p_token: S.token, p_id: c.id, p_status: st, p_assignee_id: v ? Number(v) : null });
      mergeCase(r); renderDetail(r); toast('保存しました');
    } catch (err) { fail(err); e.target.disabled = false; }
  });
  $('addNote').addEventListener('click', async (e) => {
    const body = $('memo').value.trim();
    if (!body) { $('memo').focus(); return; }
    e.target.disabled = true;
    try {
      const r = await api('yorozu_add_note', { p_token: S.token, p_id: c.id, p_body: body });
      mergeCase(r); renderDetail(r); toast('メモを足しました');
    } catch (err) { fail(err); e.target.disabled = false; }
  });
  const del = $('delCase');
  if (del) del.addEventListener('click', async () => {
    if (!confirm(`${c.no}（${c.name} 様）を削除します。元に戻せません。よろしいですか？`)) return;
    try {
      await api('yorozu_delete', { p_token: S.token, p_id: c.id });
      S.cases = S.cases.filter(x => x.id !== c.id); closeDetail(); toast('削除しました');
    } catch (err) { fail(err); }
  });
}
function mergeCase(c) {
  const i = S.cases.findIndex(x => x.id === c.id);
  const row = { ...c, note_count: c.notes ? c.notes.length : c.note_count };
  if (i >= 0) S.cases[i] = { ...S.cases[i], ...row };
  renderList();
}

// ---------- CSV ----------
$('csv').addEventListener('click', () => {
  const rows = filtered();
  const head = ['番号', '受付日時', '状況', '担当', '相談の内容', 'くわしい内容', '相談するのは', 'お名前', '電話番号', 'メール', '連絡の方法', '都合のよい時間', '完了日時'];
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const dt = (t) => t ? new Date(t).toLocaleString('ja-JP') : '';
  const lines = [head.map(q).join(',')].concat(rows.map(c => [
    c.no, dt(c.created_at), c.status, c.assignee || '', c.kinds.join('／'), c.detail || '', c.relation || '',
    c.name, c.phone, c.email || '', c.contact_method || '', c.contact_time || '', dt(c.done_at),
  ].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'よろず相談_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

// ---------- タブ ----------
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  $('casesPanel').hidden = b.dataset.tab !== 'cases';
  $('staffPanel').hidden = b.dataset.tab !== 'staff';
  if (b.dataset.tab === 'staff') loadStaff().catch(fail);
});

// ---------- 職員とPIN（管理者） ----------
let staffAll = [];
async function loadStaff() {
  staffAll = await api('yorozu_staff_list', { p_token: S.token });
  $('staffBody').innerHTML = staffAll.map(s => `
    <tr data-id="${s.id}">
      <td><input type="text" class="sName${s.active ? '' : ' off'}" value="${esc(s.name)}" maxlength="50"></td>
      <td><input type="checkbox" class="sAdmin" ${s.is_admin ? 'checked' : ''}></td>
      <td><input type="text" class="sMm" value="${esc(s.mm_username || '')}" placeholder="なし" maxlength="60"></td>
      <td><label><input type="checkbox" class="sActive" ${s.active ? 'checked' : ''}> 使える</label></td>
      <td><button class="btn ghost sSave" type="button">保存</button> <button class="btn ghost sPin" type="button">PINを作り直す</button></td>
    </tr>`).join('');
}
$('staffBody').addEventListener('click', async (e) => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const isSave = e.target.classList.contains('sSave'), isPin = e.target.classList.contains('sPin');
  if (!isSave && !isPin) return;
  const name = tr.querySelector('.sName').value.trim();
  if (isPin && !confirm(name + ' さんのPINを作り直します。今のPINは使えなくなります。よろしいですか？')) return;
  try {
    const r = await api('yorozu_staff_save', { p_token: S.token, p: {
      id: Number(tr.dataset.id), name,
      is_admin: tr.querySelector('.sAdmin').checked,
      active: tr.querySelector('.sActive').checked,
      mm_username: tr.querySelector('.sMm').value,
      reset_pin: isPin,
    } });
    if (r.pin) showPin(r.name, r.pin); else toast('保存しました');
    await loadStaff(); await loadList();
  } catch (err) { fail(err); }
});
$('addStaff').addEventListener('click', async () => {
  const name = $('newName').value.trim();
  if (!name) { $('newName').focus(); return; }
  try {
    const r = await api('yorozu_staff_save', { p_token: S.token, p: { name, mm_username: $('newMm').value, is_admin: $('newAdmin').checked } });
    $('newName').value = ''; $('newMm').value = ''; $('newAdmin').checked = false;
    showPin(r.name, r.pin);
    await loadStaff(); await loadList();
  } catch (err) { fail(err); }
});
function showPin(name, pin) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box"><div>${esc(name)} さんのPIN</div><div class="pin">${esc(pin)}</div>
    <p class="count">この画面を閉じると、もう表示できません。控えて本人に渡してください。</p>
    <button class="btn big" type="button">控えました</button></div>`;
  m.querySelector('button').addEventListener('click', () => m.remove());
  document.body.appendChild(m);
}

// ---------- テストモード（URL に ?test） ----------
function setupTest() {
  $('testBand').hidden = false;
  $('loginForm').hidden = true;
  $('testLogin').hidden = false;
  $('mmPanel').hidden = false;
  const box = $('roleBtns'); box.innerHTML = '';
  window.YorozuMock.staff().forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn big';
    b.textContent = s.name + (s.is_admin ? '（管理者）' : '（一般）') + ' として入る';
    b.addEventListener('click', async () => {
      const r = await api('yorozu_login', { p_staff_id: s.id });
      if (r.error) { $('loginMsg').textContent = r.error; return; }
      S.token = r.token; store.set(TOKEN_KEY, r.token); await start();
    });
    box.appendChild(b);
  });
  $('loginView').querySelector('p').textContent = '試し用：だれとして入るか選んでください';
  $('tbSeed').addEventListener('click', async () => { window.YorozuMock.seed(); if (S.token) await loadList(); renderMm(); toast('見本の相談を5件入れました'); });
  $('tbReset').addEventListener('click', () => {
    if (!confirm('試し用のデータを全部消して、はじめの状態にもどします。よろしいですか？')) return;
    window.YorozuMock.reset(); store.set(TOKEN_KEY, null); location.href = location.pathname + '?test';
  });
  $('tbSwitch').addEventListener('click', () => { const t = S.token; logoutLocal(''); if (t) api('yorozu_logout', { p_token: t }).catch(() => {}); });
  $('mmToggle').addEventListener('click', () => $('mmPanel').classList.toggle('open'));
  window.addEventListener('storage', () => { renderMm(); if (S.token) loadList().catch(() => {}); });
  renderMm();
}
function renderMm() {
  if (!TEST) return;
  const list = window.YorozuMock.mm();
  $('mmCount').textContent = list.length;
  $('mmList').innerHTML = list.length ? list.map(m => {
    const t = esc(m.text.replace(/^#### /, '')).replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>').replace(/@([a-z0-9._-]+)/g, '<b class="at">@$1</b>');
    return `<div class="mm-post"><div class="mm-head">よろず相談 <span>${esc(fmt(m.at))}</span></div><div class="mm-body">${t}</div></div>`;
  }).join('') : '<div class="count">まだ通知はありません。相談フォーム（試し）から送ってみてください。</div>';
}

// ---------- 起動 ----------
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#Y(\d+)$/);
  if (m && S.token && Number(m[1]) !== S.openId) openCase(Number(m[1]));
});
setInterval(() => { if (S.token && document.visibilityState === 'visible') loadList().catch(() => {}); }, 60000);
(async () => {
  if (TEST) setupTest();
  const t = store.get(TOKEN_KEY);
  if (t) { S.token = t; try { await start(); return; } catch (e) { logoutLocal(''); } }
  $('pin').focus();
})();
</script>
</body>
